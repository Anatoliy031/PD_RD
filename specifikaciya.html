<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Спецификация — PD_RD</title>
<link rel="stylesheet" href="pdrd-ui.css?v=1.0.1">
<style>
.tbl{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border-bottom:1px solid var(--line-s);padding:6px 7px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12.5px}
td.n{text-align:right;white-space:nowrap}
.trace{font-size:13px;background:var(--sheet);border:1px solid var(--line-s);border-radius:6px;padding:8px 10px;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.stat{border:1px solid var(--line-s);border-radius:6px;padding:10px 12px;background:#fff}
.stat b{display:block;font-size:22px;font-family:var(--tech)}
.stat span{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div><b>ПД и РД ВОЛС на ВЛ</b><br><span>Филиал ПАО «Россети Юг» — «Кубаньэнерго», ДРНУ</span></div>
  <nav aria-label="Разделы" id="nav"></nav>
</div></header>
<main class="wrap">
  <section class="panel">
    <h2>Длина кабеля</h2>
    <p class="sub">Трасса — пролёты, оба конца которых имеют решение с размещением кабеля. Параметры — на странице «Проект».</p>
    <div class="stats" id="stats"></div>
    <div class="trace" id="trace"></div>
    <div class="btns">
      <button class="btn primary" id="bXlsx" type="button">Скачать ведомости (XLSX)</button>
      <button class="btn" id="bKmz" type="button">Скачать трассу (KMZ)</button>
    </div>
    <div id="msg"></div>
  </section>
  <section class="panel"><h2>Спецификация оборудования, изделий и материалов</h2><p class="sub">ГОСТ 21.110-2013</p><div class="tbl"><table id="tSpec"></table></div></section>
  <section class="panel"><h2>Ведомость объёмов работ</h2><div class="tbl"><table id="tBor"></table></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="pdrd-core.js?v=1.0.1"></script>
<script src="pdrd-norms.js?v=1.0.1"></script>
<script src="pdrd-profiles.js?v=1.0.1"></script>
<script src="pdrd-marks.js?v=1.0.1"></script>
<script src="pdrd-refs-v25.js?v=1.0.1"></script>
<script src="pdrd-calc.js?v=1.0.1"></script>
<script src="pdrd-design.js?v=1.0.1"></script>
<script src="pdrd-decide.js?v=1.0.1"></script>
<script src="pdrd-spec.js?v=1.0.1"></script>
<script src="pdrd-texts.js?v=1.0.1"></script>
<script src="pdrd-docx.js?v=1.0.1"></script>
<script src="pdrd-svg.js?v=1.0.1"></script>
<script src="pdrd-xlsx.js?v=1.0.1"></script>
<script src="pdrd-kmz.js?v=1.0.1"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function save(data, name, type){ PDRD.download(data, name, type); }
  var d = PDRD.load();
  if (!d.poles.some(function(p){ return p.design && p.design.decision; })){ $('trace').textContent = 'Решения по опорам не приняты — см. страницу «Решения».'; return; }
  var sp = PDRD_SPEC.build(d), L = sp.lengths;
  [[L.route_m.toFixed(0),'м трассы'],[String(L.total_m),'м кабеля'],[String(L.sleeves),'муфт'],[String(L.eku),'ЭКУ'],[L.buildLengths === null ? '—' : String(L.buildLengths),'строительных длин']]
    .forEach(function(x){ var c = el('div','stat'); c.appendChild(el('b','',x[0].replace('.',','))); c.appendChild(el('span','',x[1])); $('stats').appendChild(c); });
  L.trace.forEach(function(t){ $('trace').appendChild(el('div','',t)); });
  function table(id, head, rows){
    var t = $(id), tr = el('tr'); head.forEach(function(h){ tr.appendChild(el('th','',h)); }); var th = el('thead'); th.appendChild(tr); t.appendChild(th);
    var tb = el('tbody'); rows.forEach(function(r){ var x = el('tr'); r.forEach(function(v, i){ x.appendChild(el('td', typeof v === 'number' ? 'n' : '', typeof v === 'number' ? String(v).replace('.', ',') : v)); }); tb.appendChild(x); }); t.appendChild(tb);
  }
  table('tSpec', ['Поз.','Наименование','Тип, марка','Ед.','Кол.','Масса, кг','Примечание'], sp.items.map(function(x){ return [x.pos, x.name, x.type, x.unit, x.qty, x.mass === '' ? '' : x.mass, x.note]; }));
  table('tBor', ['№','Работа','Ед.','Кол.','Примечание'], PDRD_SPEC.bor(d, sp).map(function(x){ return [x.pos, x.name, x.unit, x.qty, x.note]; }));
  $('bXlsx').onclick = function(){
    try { var r = PDRD_XLSX.toArray(d); save(r.data, (d.passport.shifr || 'PD_RD').replace(/[^\w\-]+/g,'_') + '-vedomosti.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); $('msg').textContent = 'Листов в книге: ' + (r.sheets + 1); }
    catch(e){ $('msg').textContent = 'Ошибка: ' + e.message; }
  };
  $('bKmz').onclick = function(){ PDRD_KMZ.kmz(d).then(function(b){ save(b, (d.passport.shifr || 'PD_RD').replace(/[^\w\-]+/g,'_') + '-trassa.kmz', 'application/vnd.google-earth.kmz'); }); };
})();
</script>
<script src="pdrd-nav.js?v=1.0.1"></script>
</body>
</html>
